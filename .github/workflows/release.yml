name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-contract:
    name: Verify release contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify annotated tag, versions, compiler, and changelog
        run: bash scripts/check-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

  check:
    name: Check and package ${{ matrix.name }}
    needs: release-contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            subdir: linux-64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            subdir: linux-aarch64
          - name: macOS ARM64
            os: macos-14
            subdir: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
      - run: pixi run --locked check
      - name: Build and test installed Conda package
        run: pixi run --locked package
      - name: Validate emitted package index
        run: |
          pixi_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pixi.toml)
          bash scripts/check-package.sh mojo-shuhafft "$pixi_version" "${{ matrix.subdir }}"

  publish:
    name: Publish source release
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build source archive
        run: >-
          git archive --format=tar.gz
          --prefix="shuhafft-${GITHUB_REF_NAME}/"
          --output="shuhafft-${GITHUB_REF_NAME}.tar.gz"
          "${GITHUB_SHA}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "shuhafft-${GITHUB_REF_NAME}.tar.gz"
          --verify-tag --generate-notes
          --title "ShuhaFFT ${GITHUB_REF_NAME}"
